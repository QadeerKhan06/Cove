name: Build and test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore Cove.sln

      - name: Build
        run: dotnet build Cove.sln --no-restore -c Release

      - name: Run tests
        run: dotnet test Cove.sln --no-build -c Release